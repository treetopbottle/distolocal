[package]
name = "distolocal"
version = "0.1.0"
edition = "2024"

[dependencies]
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
# The approval-testing library a `Then` is written in; see DECISIONS.md 0010.
insta = "1.48"
# `datetime!`, for the fixed instants the test clocks read; `parsing`, for
# the times `given()` reads back out of the dump notation.
time = { version = "0.3", features = ["macros", "parsing"] }
