[package]
name = "distolocal"
version = "0.1.0"
edition = "2024"

[dependencies]
time = { version = "0.3", features = ["formatting"] }

[dev-dependencies]
# Inline snapshot tests.
insta = "1.48"
# `datetime!` for the test clocks; `parsing` for `parse_store`.
time = { version = "0.3", features = ["macros", "parsing"] }
